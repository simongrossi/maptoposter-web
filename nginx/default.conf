# Gateway nginx de MapPoster.
# Ecoute uniquement sur le port 80 du conteneur ; docker-compose publie
# 127.0.0.1:8080:80. Caddy (hote) termine le TLS et proxifie vers 8080.

# IP reelle : Caddy (hote ou conteneur) est un proxy de confiance. On ne fait
# confiance qu'aux plages privees / loopback, jamais a Internet.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Format de log sans query string : les signatures des URLs de telechargement
# ne doivent pas atterrir dans les journaux. Les cles d'objets (qui contiennent
# le nom de la ville) sont egalement masquees.
map $uri $loggable_uri {
    default $uri;
    ~^/api/download/ "/api/download/[redacted]";
}

log_format maptoposter '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $loggable_uri $server_protocol" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent"';

limit_req_zone $binary_remote_addr zone=api_rl:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # Derriere Caddy, l'IP cliente arrive dans X-Forwarded-For.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log /var/log/nginx/access.log maptoposter;

    # En-tetes de securite. HSTS est emis par Caddy (qui voit le HTTPS).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # geolocation=(self) : autorise le bouton « Ma position » sur notre origine
    # tout en bloquant camera/microphone et les iframes tierces.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # Sonde de sante du gateway (utilisee par le healthcheck Docker).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API FastAPI. Le prefixe /api est retire avant transmission.
    location /api/ {
        limit_req zone=api_rl burst=40 nodelay;
        limit_conn api_conn 20;

        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Les posters sont streames depuis l'API : pas de mise en tampon.
        proxy_buffering off;
    }

    # Ancien prefixe MinIO : supprime volontairement. Les posters passent
    # desormais par /api/download/<cle>?expires=...&signature=...
    location /minio_storage/ {
        return 410;
    }

    # Frontend SvelteKit SSR.
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Fichiers sensibles / caches.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }
}
