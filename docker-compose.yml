# MapPoster Web - stack de production (VPS mono-noeud)
#
# Principes :
#   - seul le gateway publie un port, et uniquement sur la boucle locale ;
#   - redis et le stockage S3 ne sont joignables que sur un reseau Docker interne ;
#   - aucun secret n'a de valeur par defaut : Compose refuse de demarrer tant que
#     les variables marquees ":?" ne sont pas definies dans .env ;
#   - toutes les images sont figees sur une version precise.
#
# Copier .env.example vers .env puis lancer ./scripts/init-env.sh (ou renseigner
# les secrets a la main) avant "docker compose up -d --build".

name: ${COMPOSE_PROJECT_NAME:-maptoposter}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &default-hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  # --------------------------------------------------------------------------
  # 1. Gateway HTTP (derriere le Caddy de l'hote, qui termine le TLS)
  # --------------------------------------------------------------------------
  gateway:
    image: nginx:1.28.0-alpine
    <<: *default-hardening
    ports:
      # 80 et 443 restent la propriete de Caddy sur l'hote.
      # Seul 127.0.0.1:8080 est expose, jamais 0.0.0.0.
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 128

  # --------------------------------------------------------------------------
  # 2. Broker / result backend Celery (jamais publie)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7.4.2-alpine
    <<: *default-hardening
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Definir REDIS_PASSWORD dans .env (openssl rand -hex 32)}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Definir REDIS_PASSWORD dans .env (openssl rand -hex 32)}
    volumes:
      - redis_data:/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 128

  # --------------------------------------------------------------------------
  # 3. Stockage objet S3 prive (VersityGW, backend POSIX)
  #    Remplace minio/minio + minio/mc, indisponibles sur les registries.
  #    API S3 sur le reseau interne uniquement, aucun bucket public.
  # --------------------------------------------------------------------------
  storage:
    image: versity/versitygw:v1.10.0
    <<: *default-hardening
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:?Definir S3_ACCESS_KEY dans .env}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:?Definir S3_SECRET_KEY dans .env}
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data
      VGW_PORT: ":8333"
      VGW_HEALTH: /_/health
      VGW_REGION: ${S3_REGION:-us-east-1}
      VGW_QUIET: "true"
      VGW_MAX_CONNECTIONS: "256"
      VGW_MAX_REQUESTS: "128"
    volumes:
      - posters_data:/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/_/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 256

  # --------------------------------------------------------------------------
  # 4. API FastAPI (dispatcher leger, jamais publie)
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    <<: *default-hardening
    command:
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --no-access-log
      - --limit-concurrency
      - "128"
      - --timeout-keep-alive
      - "5"
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?Definir REDIS_PASSWORD dans .env}@redis:6379/0
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://storage:8333}
      S3_BUCKET: ${S3_BUCKET:-posters}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Definir S3_ACCESS_KEY dans .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Definir S3_SECRET_KEY dans .env}
      SESSION_SECRET: ${SESSION_SECRET:?Definir SESSION_SECRET dans .env (openssl rand -hex 32)}
      DOWNLOAD_SIGNING_SECRET: ${DOWNLOAD_SIGNING_SECRET:?Definir DOWNLOAD_SIGNING_SECRET dans .env (openssl rand -hex 32)}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SESSION_TTL: ${SESSION_TTL:-604800}
      DOWNLOAD_URL_TTL: ${DOWNLOAD_URL_TTL:-900}
      GENERATE_RATE_LIMIT: ${GENERATE_RATE_LIMIT:-5/minute}
      DAILY_GENERATE_QUOTA: ${DAILY_GENERATE_QUOTA:-50}
      MAX_ACTIVE_JOBS_PER_SESSION: ${MAX_ACTIVE_JOBS_PER_SESSION:-2}
      MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-20}
      MAX_DISTANCE_METERS: ${MAX_DISTANCE_METERS:-25000}
      MAX_OUTPUT_PIXELS: ${MAX_OUTPUT_PIXELS:-100000000}
      MAX_IMAGE_DIMENSION_INCHES: ${MAX_IMAGE_DIMENSION_INCHES:-40}
      MAX_RENDER_DPI: ${MAX_RENDER_DPI:-600}
      POSTER_RETENTION_DAYS: ${POSTER_RETENTION_DAYS:-7}
      MAX_STORED_POSTERS: ${MAX_STORED_POSTERS:-2000}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-Europe/Paris}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-131072}
      MAX_ARCHIVE_BYTES: ${MAX_ARCHIVE_BYTES:-536870912}
      TASK_SOFT_TIME_LIMIT: ${TASK_SOFT_TIME_LIMIT:-480}
      TASK_TIME_LIMIT: ${TASK_TIME_LIMIT:-540}
      TASK_MAX_AGE: ${TASK_MAX_AGE:-900}
      TASK_RESULT_TTL: ${TASK_RESULT_TTL:-3600}
      ACTIVE_JOB_TTL: ${ACTIVE_JOB_TTL:-900}
      CELERY_RESULT_TTL: ${CELERY_RESULT_TTL:-3600}
      WORKER_MAX_MEMORY_KB: ${WORKER_MAX_MEMORY_KB:-1500000}
      CELERY_QUEUE: ${CELERY_QUEUE:-celery}
      NOMINATIM_USER_AGENT: "${NOMINATIM_USER_AGENT:-MapPoster/2.3.2 (+https://github.com/simongrossi/maptoposter-web)}"
      GEOCODE_TIMEOUT: ${GEOCODE_TIMEOUT:-10}
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MALLOC_ARENA_MAX: "2"
      MPLCONFIGDIR: /app/.cache/matplotlib
    cap_drop:
      - ALL
    cap_add:
      # Uniquement pour l'entrypoint : chown du volume de cache puis setpriv.
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - edge
      - data_net
    depends_on:
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 256

  # --------------------------------------------------------------------------
  # 5. Worker Celery (rendu lourd, plafonne en memoire)
  # --------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    <<: *default-hardening
    command:
      - celery
      - -A
      - backend.tasks
      - worker
      - --loglevel=INFO
      - --queues=${CELERY_QUEUE:-celery}
      - --concurrency=1
      - --prefetch-multiplier=1
      - --max-tasks-per-child=1
      - --max-memory-per-child=${WORKER_MAX_MEMORY_KB:-1500000}
      - -Ofair
      - --without-gossip
      - --without-mingle
      - --without-heartbeat
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?Definir REDIS_PASSWORD dans .env}@redis:6379/0
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://storage:8333}
      S3_BUCKET: ${S3_BUCKET:-posters}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Definir S3_ACCESS_KEY dans .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Definir S3_SECRET_KEY dans .env}
      SESSION_SECRET: ${SESSION_SECRET:?Definir SESSION_SECRET dans .env}
      DOWNLOAD_SIGNING_SECRET: ${DOWNLOAD_SIGNING_SECRET:?Definir DOWNLOAD_SIGNING_SECRET dans .env}
      POSTER_RETENTION_DAYS: ${POSTER_RETENTION_DAYS:-7}
      MAX_STORED_POSTERS: ${MAX_STORED_POSTERS:-2000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-Europe/Paris}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      MAX_ARCHIVE_BYTES: ${MAX_ARCHIVE_BYTES:-536870912}
      TASK_SOFT_TIME_LIMIT: ${TASK_SOFT_TIME_LIMIT:-480}
      TASK_TIME_LIMIT: ${TASK_TIME_LIMIT:-540}
      TASK_MAX_AGE: ${TASK_MAX_AGE:-900}
      TASK_RESULT_TTL: ${TASK_RESULT_TTL:-3600}
      ACTIVE_JOB_TTL: ${ACTIVE_JOB_TTL:-900}
      CELERY_RESULT_TTL: ${CELERY_RESULT_TTL:-3600}
      WORKER_MAX_MEMORY_KB: ${WORKER_MAX_MEMORY_KB:-1500000}
      CELERY_QUEUE: ${CELERY_QUEUE:-celery}
      NOMINATIM_USER_AGENT: "${NOMINATIM_USER_AGENT:-MapPoster/2.3.2 (+https://github.com/simongrossi/maptoposter-web)}"
      GEOCODE_TIMEOUT: ${GEOCODE_TIMEOUT:-10}
      OSM_NETWORK_TYPE: ${OSM_NETWORK_TYPE:-auto}
      OSM_REQUEST_TIMEOUT: ${OSM_REQUEST_TIMEOUT:-150}
      OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api}
      OSM_FORCE_IPV4: ${OSM_FORCE_IPV4:-true}
      CACHE_DIR: /.cache
      MPLCONFIGDIR: /.cache/matplotlib
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MALLOC_ARENA_MAX: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    cap_drop:
      - ALL
    cap_add:
      # Uniquement pour l'entrypoint : chown du volume de cache puis setpriv.
      - CHOWN
      - SETUID
      - SETGID
    volumes:
      - osm_cache:/.cache
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      - edge
      - data_net
    depends_on:
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    stop_grace_period: 60s
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    pids_limit: 512

  # --------------------------------------------------------------------------
  # 6. Frontend SvelteKit SSR (jamais publie)
  # --------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    <<: *default-hardening
    environment:
      API_URL: http://api:8000
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      BODY_SIZE_LIMIT: "65536"
      TZ: ${TZ:-Europe/Paris}
    cap_drop:
      - ALL
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 1.0
    pids_limit: 256

networks:
  # Réseau exposé au gateway et au frontend ; fournit aussi la sortie Internet
  # dont le worker a besoin pour OSM/Nominatim.
  edge:
    driver: bridge
  # Réseau sans passerelle : redis et le stockage n'ont aucune route sortante.
  data_net:
    driver: bridge
    internal: true

volumes:
  redis_data:
  posters_data:
  osm_cache:

