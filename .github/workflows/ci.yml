name: MapPoster CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    env:
      # Secrets factices uniquement pour les tests. Aucune valeur reelle ici.
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: posters-test
      S3_ACCESS_KEY: test-access-key
      S3_SECRET_KEY: test-secret-key
      SESSION_SECRET: test-session-secret-0123456789abcdef0123456789abcdef
      DOWNLOAD_SIGNING_SECRET: test-signing-secret-0123456789abcdef0123456789abcdef
      ENABLE_DOCS: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run Backend Tests
        run: pytest

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Run Build Check
        run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          # Le compose refuse de demarrer sans secrets : on fournit des valeurs
          # factices pour valider uniquement la syntaxe et les references.
          cat > .env <<'EOF'
          COMPOSE_PROJECT_NAME=maptoposter-ci
          PUBLIC_BASE_URL=
          REDIS_PASSWORD=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          S3_ACCESS_KEY=test-access-key
          S3_SECRET_KEY=test-secret-key
          S3_BUCKET=posters
          S3_REGION=us-east-1
          S3_ENDPOINT_URL=http://storage:8333
          SESSION_SECRET=test-session-secret-0123456789abcdef0123456789abcdef
          DOWNLOAD_SIGNING_SECRET=test-signing-secret-0123456789abcdef0123456789abcdef
          ENABLE_DOCS=false
          EOF
          docker compose config >/dev/null
          echo "docker-compose.yml valide"
